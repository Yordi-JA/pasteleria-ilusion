# Solo la base de datos de desarrollo. Django corre en el venv (backend/.venv).
# Las credenciales y el puerto salen de backend/.env (ver .env.example).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en backend/.env}
    ports:
      # Solo la propia máquina; nunca se expone a la red.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+: el volumen va en /var/lib/postgresql (no en .../data);
      # PGDATA queda en /var/lib/postgresql/18/docker.
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
